<line x1="631" y1="298" x2="854" y2="298" stroke="#c4b5fd" stroke-width="1" opacity="0.5"/>
<text x="631" y="314" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="631" dy="0">43 frameworks from strategy to</tspan><tspan x="631" dy="17">AI architecture and evaluation.</tspan></text>
<rect x="631" y="347" width="151" height="24" rx="12" fill="none" stroke="#c4b5fd" stroke-width="1.5"/><text x="642" y="364" font-size="12.5" font-weight="700" fill="#c4b5fd">Reference playbook</text>
<text x="600" y="440" text-anchor="middle" font-size="13" fill="#94a3b8">Amber means prototype or MVP and is labelled as such in each repo. Status is taken from each project's own README.</text>
