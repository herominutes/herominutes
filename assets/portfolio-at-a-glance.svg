<text x="61" y="140" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="61" dy="0">Private, iPhone-first AI copilot</tspan><tspan x="61" dy="17">for product leaders, with a</tspan><tspan x="61" dy="17">published case study.</tspan></text>
<rect x="61" y="190" width="209" height="24" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5"/><text x="72" y="207" font-size="12.5" font-weight="700" fill="#fbbf24">Prototype, internal builds</text>
