<rect x="61" y="347" width="216" height="24" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5"/><text x="72" y="364" font-size="12.5" font-weight="700" fill="#fbbf24">Prototype, partly demo data</text>
