<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Portfolio at a glance</title>
<desc id="d">Seven projects with a one-line description and an honest status for each.</desc>
<rect width="1200" height="470" rx="14" fill="#0f172a"/>
