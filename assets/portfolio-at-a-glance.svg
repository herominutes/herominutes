<rect x="346" y="364" width="94" height="24" rx="12" fill="none" stroke="#60a5fa" stroke-width="1.5"/><text x="357" y="381" font-size="12.5" font-weight="700" fill="#60a5fa">MCP server</text>
<rect x="615" y="258" width="255" height="152" rx="12" fill="#111c33" stroke="#c4b5fd" stroke-width="2"/>
