<text x="631" y="140" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="631" dy="0">PM agent on the Claude API that</tspan><tspan x="631" dy="17">scores a feature before it earns</tspan><tspan x="631" dy="17">engineering time.</tspan></text>
